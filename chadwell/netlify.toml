# Netlify settings for David Mott's pickleball coaching site (plain static site — no build step)
[build]
  publish = "."

# Photos rarely change: cache them for a week (AVIF + WebP)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Basic security headers for every page
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
